spring.application.name=demo
server.port=8181

# Return RFC 9457 application/problem+json for framework errors (400, 404, 405 ...) too
spring.mvc.problemdetails.enabled=true

# PostgreSQL connection. Override in containers with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=demo
spring.datasource.password=demo

# Liquibase creates the schema and loads seed data from db/changelog/data/tasks.csv
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
